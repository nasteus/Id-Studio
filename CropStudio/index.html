<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ID Studio</title>
    <script>
      (function() {
        try {
          var s = localStorage.getItem('app_state');
          var theme = 'theme-aperture';
          if (s) {
            var p = JSON.parse(s);
            if (p && p.appTheme) theme = p.appTheme;
          }
          document.documentElement.className = theme;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="./assets/index-Bp0rKAwA.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-TgHUVkS-.css">
    <link rel="stylesheet" href="./id-studio-preview.css">
  </head>
  <body class="theme-aperture">
    <div id="app"></div>
    <script>
      (function() {
        var isArranging = false;
        var rafId = null;
        var savedSizeDropdown = null;
        var savedCopiesDropdown = null;

        var dropdownParking = document.getElementById('id-studio-dropdown-parking');
        if (!dropdownParking) {
          dropdownParking = document.createElement('div');
          dropdownParking.id = 'id-studio-dropdown-parking';
          dropdownParking.style.display = 'none';
          document.body.appendChild(dropdownParking);
        }

        function arrangeBottomBar() {
          if (isArranging) return;
          var bottomBar = document.querySelector('.horizon-control-panel');
          if (!bottomBar) return;

          // 1. Selector Marime (cautat in DOM sau preluat din memorie/parking)
          var sizeDropdown = document.querySelector('.editbar-dropdown-wrapper:not(.copies-dropdown-wrapper)');
          if (sizeDropdown) {
            savedSizeDropdown = sizeDropdown;
          } else if (savedSizeDropdown) {
            sizeDropdown = savedSizeDropdown;
          }

          // 2. Selector Numar Copii
          var copiesDropdown = document.querySelector('.copies-dropdown-wrapper');
          if (copiesDropdown) {
            savedCopiesDropdown = copiesDropdown;
          } else if (savedCopiesDropdown) {
            copiesDropdown = savedCopiesDropdown;
          }

          var isAdjustmentPanel = bottomBar.classList.contains('brightness-control-panel') ||
                                  bottomBar.classList.contains('contrast-control-panel') ||
                                  bottomBar.classList.contains('highlights-control-panel') ||
                                  bottomBar.classList.contains('shadows-control-panel');

          var targetOrder;

          if (isAdjustmentPanel) {
            // Mod ajustari imagine: Parcam dropdown-urile sa nu fie vizibile
            if (sizeDropdown && sizeDropdown.parentNode !== dropdownParking) {
              dropdownParking.appendChild(sizeDropdown);
            }
            if (copiesDropdown && copiesDropdown.parentNode !== dropdownParking) {
              dropdownParking.appendChild(copiesDropdown);
            }

            // In bara de jos ramane EXCLUSIV: [ Reset (R), Slider complet, OK (Confirmare) ]
            var adjResetBtn = bottomBar.querySelector('button.reset-btn') ? bottomBar.querySelector('button.reset-btn').closest('.hole-container') : null;
            var adjSlider = bottomBar.querySelector('.horizon-slider-pill') ? (bottomBar.querySelector('.horizon-slider-pill').closest('.hole-container-pill') || bottomBar.querySelector('.horizon-slider-pill')) : null;
            var adjConfirmBtn = bottomBar.querySelector('button.confirm-brightness-btn') ? bottomBar.querySelector('button.confirm-brightness-btn').closest('.hole-container') : null;

            // La apasarea tastei R in modul de ajustare: reseteaza si iese inapoi la bottombar normal
            if (adjResetBtn && !adjResetBtn.__hasExitOnReset) {
              adjResetBtn.__hasExitOnReset = true;
              adjResetBtn.addEventListener('click', function() {
                setTimeout(function() {
                  var confirm = bottomBar.querySelector('button.confirm-brightness-btn');
                  if (confirm) confirm.click();
                }, 40);
              });
            }

            targetOrder = [
              adjResetBtn,
              adjSlider,
              adjConfirmBtn
            ].filter(Boolean);
          } else {
            // Mod normal: Decupare & Orizont complet (restabilim dropdown-urile in fata)
            var flipHBtn = bottomBar.querySelector('button[title*="Flip H"], button[title*="Oglindire Orizontal"]') ? bottomBar.querySelector('button[title*="Flip H"], button[title*="Oglindire Orizontal"]').closest('.hole-container') : null;
            var rotateRightBtn = bottomBar.querySelector('button[title*="dreapta"], button[title*="+90"]') ? bottomBar.querySelector('button[title*="dreapta"], button[title*="+90"]').closest('.hole-container') : null;
            var slider = bottomBar.querySelector('.horizon-slider-pill') ? (bottomBar.querySelector('.horizon-slider-pill').closest('.hole-container-pill') || bottomBar.querySelector('.horizon-slider-pill')) : null;
            var horizonAngleBtn = bottomBar.querySelector('button[title*="Unghi Orizont"]') ? bottomBar.querySelector('button[title*="Unghi Orizont"]').closest('.hole-container') : null;
            var resetBtn = bottomBar.querySelector('button.reset-btn, button[title*="Resetează Decuparea"]') ? bottomBar.querySelector('button.reset-btn, button[title*="Resetează Decuparea"]').closest('.hole-container') : null;

            targetOrder = [
              sizeDropdown,
              copiesDropdown,
              flipHBtn,
              rotateRightBtn,
              slider,
              horizonAngleBtn,
              resetBtn
            ].filter(Boolean);
          }

          if (targetOrder.length < 2) return;

          var currentChildren = Array.from(bottomBar.children);
          var alreadyCorrect = targetOrder.length === currentChildren.length && targetOrder.every(function(item, idx) {
            return currentChildren[idx] === item;
          });

          if (alreadyCorrect) return;

          isArranging = true;
          if (observer) observer.disconnect();
          try {
            for (var i = 0; i < targetOrder.length; i++) {
              bottomBar.appendChild(targetOrder[i]);
            }
          } finally {
            isArranging = false;
            if (observer) observer.observe(document.body, { childList: true, subtree: true });
          }
        }

        function scheduleArrange() {
          if (isArranging || rafId) return;
          rafId = requestAnimationFrame(function() {
            rafId = null;
            arrangeBottomBar();
          });
        }

        var observer = new MutationObserver(scheduleArrange);
        observer.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('DOMContentLoaded', scheduleArrange);
        window.addEventListener('load', scheduleArrange);
      })();
    </script>
    <script src="./id-studio-preview.js"></script>
  </body>
</html>
